name: Price alerts

# Alertes "seuil_technique" (verdict actif dont le prix a franchi son seuil) dans
# data/alerts.json, jauges brutes (peur/cupidité, dominance BTC, or) dans data/market-gauges.json,
# on-chain du bitcoin, point du jour du portefeuille (fil des médias : robot news-feed à part) —
# calcul pur, aucun quota Claude. Horaires choisis hors des créneaux des
# routines Cowork (00:15/08:15/16:15, 04:00, 06:xx, 08:xx-09:xx, 18:xx) pour éviter les push
# concurrents sur main.
on:
  schedule:
    - cron: "40 2,10,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Échéances (verdicts, horizons, groupe témoin) AVANT les alertes : la tâche horaire resolve-due
      # n'est lancée par GitHub que 3 à 4 fois par jour (8 passages du 11/10 08h au 13/10 00h40) ;
      # ce passage-ci en ajoute 4. Créneaux des routines respectés par le script (QUIET_WINDOWS).
      - run: node scripts/resolve-due.mjs
        continue-on-error: true
      - run: node scripts/price-alerts.mjs
      # Échec des jauges = sans effet sur les alertes (étape indépendante).
      - run: node scripts/market-gauges.mjs
        continue-on-error: true
      # On-chain du bitcoin (blockchain.info + DefiLlama) : étape indépendante elle aussi.
      - run: node scripts/onchain-btc.mjs
        continue-on-error: true
      # Valeur du portefeuille : le point du jour est rafraîchi à chaque passage (4×/jour) — un seul
      # passage quotidien, retardé de 3 à 5 h par GitHub, laissait l'historique 36 h sans valeur.
      - run: node scripts/portfolio-snapshot.mjs
        continue-on-error: true
      - name: Commit si quelque chose a changé
        run: |
          git add -N data/market-gauges.json 2>/dev/null || true
          RESOLVED="data/verdicts.json data/engine-history.json data/opportunities.json data/control-group.json"
          git diff --quiet -- data/alerts.json data/market-gauges.json data/onchain-history.json data/portfolio-history.json $RESOLVED && exit 0
          for f in $RESOLVED; do python3 -m json.tool "$f" >/dev/null; done
          python3 -m json.tool data/portfolio-history.json >/dev/null
          python3 -m json.tool data/onchain-history.json >/dev/null
          python3 -m json.tool data/alerts.json >/dev/null
          [ ! -f data/market-gauges.json ] || python3 -m json.tool data/market-gauges.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json
          [ ! -f data/market-gauges.json ] || git add data/market-gauges.json
          git add data/onchain-history.json data/portfolio-history.json $RESOLVED
          git commit -m "Alertes et jauges du $(date -u "+%d/%m/%Y %Hh%M") UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
