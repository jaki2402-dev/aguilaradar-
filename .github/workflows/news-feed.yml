name: News feed

# Fil des médias (data/news-feed.json) : titres réels datés des médias crypto citant un favori, et
# événements de tout le marché (piratage de plateforme, stablecoins, régulation). Robot à part, toutes
# les 30 min : intégré au robot des alertes, il ne passait que 3 fois par jour (GitHub retarde et
# saute les tâches planifiées) — le piratage de Binance du 29/10/2026 n'a jamais été relevé.
# Commit seulement s'il y a un titre nouveau, ou si le dernier relevé publié a plus de 3 h.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# File d'attente À PART (pas data-commit) : GitHub ne garde qu'une exécution en attente par groupe
# et annule les plus anciennes — toutes les 30 min, ce robot aurait fait sauter les passages en
# attente des alertes, des échéances ou de l'analyse technique. Il n'écrit que son propre fichier :
# le pull --rebase du commit suffit à éviter tout conflit.
concurrency:
  group: news-feed
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/news-feed.mjs
      - name: Commit si nouveaux titres
        run: |
          [ -f data/news-feed.json ] || exit 0
          python3 -m json.tool data/news-feed.json >/dev/null
          python3 - <<'PY' || exit 0
          import json, subprocess, sys, datetime as dt
          new = json.load(open("data/news-feed.json"))
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:data/news-feed.json"], capture_output=True, text=True, check=True).stdout)
          except Exception:
              sys.exit(0)  # premier fichier : à publier
          fresh = {i["url"] for i in new.get("items", [])} - {i["url"] for i in old.get("items", [])}
          age_h = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(old["updated_at"].replace("Z", "+00:00"))).total_seconds() / 3600
          print(f"{len(fresh)} titre(s) nouveau(x), dernier relevé publié il y a {age_h:.1f} h")
          sys.exit(0 if fresh or age_h >= 3 else 1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Fil des médias du $(date -u "+%d/%m/%Y %Hh%M") UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
