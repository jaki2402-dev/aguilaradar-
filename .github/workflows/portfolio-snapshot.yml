name: Portfolio snapshot

# 1 point réel par jour dans data/portfolio-history.json (graphique "Évolution de la valeur
# totale"). Tourne sur GitHub, pas dans une routine Claude : ne consomme aucun quota.
on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/portfolio-snapshot.mjs
      - name: Commit si un point a été ajouté
        run: |
          git diff --quiet -- data/portfolio-history.json && exit 0
          python3 -m json.tool data/portfolio-history.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-history.json
          git commit -m "Snapshot portefeuille du $(date -u +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
